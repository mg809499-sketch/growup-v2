# NOTA: este compose es SOLO para desarrollo local (Redis + MinIO + API/worker opcionales).
# Producción = Fly.io (API/workers) + Vercel (frontends) + Supabase (DB) + Upstash (Redis).
# Ver docs/adr/0008-topologia-despliegue.md y ADR-0012. Nunca copiar valores de aquí a prod.
name: growup-local

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - minio-data:/data

  mc-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"
      && mc mb -p local/growup-catalog-local || true
      && mc anonymous set download local/growup-catalog-local || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  api:
    # Opcional: normalmente se corre con `uv run uvicorn` en el host.
    # Uso: docker compose -f infra/docker-compose.yml --profile app up -d --build
    profiles: ["app"]
    build:
      context: ../services/api
      dockerfile: Dockerfile
    env_file: ../services/api/.env
    environment:
      GROWUP_REDIS_URL: redis://redis:6379/0
      GROWUP_R2_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ../services/api
      dockerfile: Dockerfile.worker
    env_file: ../services/api/.env
    environment:
      GROWUP_REDIS_URL: redis://redis:6379/0
      GROWUP_R2_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  redis-data:
  minio-data:
