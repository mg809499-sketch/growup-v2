# Fly.io — API producción. 2 máquinas siempre encendidas; scale-to-zero NO aplica.
# Deploy: fly deploy -a growup-api-production   (tras migrar DB; orden: migraciones → API → frontends)
app = "growup-api-production"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "../../services/api/Dockerfile"

[env]
  GROWUP_ENVIRONMENT = "production"
  GROWUP_ROOT_DOMAIN = "growup.com"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2
