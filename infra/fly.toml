# Fly.io — API staging (gru / São Paulo; región más cercana factible a Colombia).
# Deploy: fly deploy -a growup-api-staging   (secrets vía `fly secrets set`, nunca en este archivo)
app = "growup-api-staging"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "../../services/api/Dockerfile"

[env]
  GROWUP_ENVIRONMENT = "staging"
  GROWUP_ROOT_DOMAIN = "growup.com"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
