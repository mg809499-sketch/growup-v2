name: Deploy

# Staging: automático en cada push a main (tras CI verde en ese SHA).
# Producción: manual (workflow_dispatch), con environment protegido y checklist.
# Orden obligatorio: validación de secretos → migraciones → API/worker (Fly) → frontends (Vercel, vía Git integration u hook).
# Sin secretos en el repo: todo se inyecta desde GitHub Secrets/Environments.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente destino"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging (Fly)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    environment: staging
    steps:
      - name: Validate required secrets
        run: |
          missing=0
          for var in FLY_API_TOKEN_STAGING GROWUP_MIGRATION_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Secreto requerido ausente: $var (Environment 'staging')"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          FLY_API_TOKEN_STAGING: ${{ secrets.FLY_API_TOKEN_STAGING }}
          GROWUP_MIGRATION_URL: ${{ secrets.GROWUP_MIGRATION_URL }}

      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Apply DB migrations (staging)
        run: |
          python -m pip install --quiet psycopg[binary]
          python - <<'EOF'
          import os, glob, psycopg
          with psycopg.connect(os.environ["GROWUP_MIGRATION_URL"], autocommit=True) as conn:
              for path in sorted(glob.glob("supabase/migrations/*.sql")):
                  print("Applying", path)
                  conn.execute(open(path, encoding="utf-8").read())
          EOF
        env:
          GROWUP_MIGRATION_URL: ${{ secrets.GROWUP_MIGRATION_URL }}

      - name: Deploy API (staging)
        run: flyctl deploy --remote-only --config infra/fly.toml --app growup-api-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Deploy worker (staging)
        run: flyctl deploy --remote-only --config infra/fly.worker.toml --app growup-worker-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

  deploy-production:
    name: Deploy production (Fly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    environment: production
    steps:
      - name: Validate required secrets
        run: |
          missing=0
          for var in FLY_API_TOKEN_PRODUCTION GROWUP_MIGRATION_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Secreto requerido ausente: $var (Environment 'production')"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          FLY_API_TOKEN_PRODUCTION: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
          GROWUP_MIGRATION_URL: ${{ secrets.GROWUP_MIGRATION_URL }}

      - name: Preflight checklist
        run: |
          echo "Checklist obligatorio antes de aprobar este job:"
          echo "  [ ] Backup PITR verificado en las últimas 24h"
          echo "  [ ] Migración compat hacia atrás (expand/contract) y pgTAP verdes"
          echo "  [ ] Smoke tests en staging verdes para el mismo SHA"
          echo "  [ ] Ventana de cambio acordada; on-call disponible"
          echo "  [ ] Rollback ensayado (Vercel Instant Rollback / fly release anterior)"

      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Apply DB migrations (production)
        run: |
          python -m pip install --quiet psycopg[binary]
          python - <<'EOF'
          import os, glob, psycopg
          with psycopg.connect(os.environ["GROWUP_MIGRATION_URL"], autocommit=True) as conn:
              for path in sorted(glob.glob("supabase/migrations/*.sql")):
                  print("Applying", path)
                  conn.execute(open(path, encoding="utf-8").read())
          EOF
        env:
          GROWUP_MIGRATION_URL: ${{ secrets.GROWUP_MIGRATION_URL }}

      - name: Deploy API (production)
        run: flyctl deploy --remote-only --config infra/fly.production.toml --app growup-api-production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

      - name: Deploy worker (production)
        run: flyctl deploy --remote-only --config infra/fly.worker.toml --app growup-worker-production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
