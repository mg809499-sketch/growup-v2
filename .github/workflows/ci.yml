name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Install PostgreSQL client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        working-directory: .
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "postgresql://postgres:postgres@localhost:5432/growup" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Tests
        env:
          GROWUP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growup
        run: uv run pytest

  db:
    name: DB (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

  contracts:
    name: Contracts (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync API dependencies
        run: cd services/api && uv sync

      - name: Check contracts are up to date
        run: pnpm contracts:check

  frontend:
    name: Frontend (storefront + admin)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint storefront
        run: pnpm --filter @growup/storefront lint

      - name: Typecheck storefront
        run: pnpm --filter @growup/storefront typecheck

      - name: Build storefront
        run: pnpm --filter @growup/storefront build

      - name: Lint admin
        run: pnpm --filter @growup/admin lint

      - name: Typecheck admin
        run: pnpm --filter @growup/admin typecheck

      - name: Build admin
        run: pnpm --filter @growup/admin build

  security:
    name: Security (audit + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        working-directory: services/api
        run: |
          uv sync
          uv run --with pip-audit pip-audit --strict || true   # reporte; no bloquea piloto, revisar semanalmente

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high || true         # reporte; no bloquea piloto, revisar semanalmente

  docker:
    name: Docker (build + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        working-directory: services/api
        run: docker build -f Dockerfile -t growup-api:ci .

      - name: Build worker image
        working-directory: services/api
        run: docker build -f Dockerfile.worker -t growup-worker:ci .

      - name: Trivy scan (API)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: growup-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan (worker)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: growup-worker:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
