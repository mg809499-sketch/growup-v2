name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Install PostgreSQL client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        working-directory: .
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "postgresql://postgres:postgres@localhost:5432/growup" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Tests
        env:
          GROWUP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growup
        run: uv run pytest

  db:
    name: DB (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

  contracts:
    name: Contracts (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync API dependencies
        run: cd services/api && uv sync

      - name: Check contracts are up to date
        run: pnpm contracts:check

  # El job de frontend se activa cuando `apps/storefront` tenga package.json
  # (después de integrar el export de v0).
