<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-labelledby="tD09 dD09">
  <title id="tD09">D-09 - DPA Processor/Controller y onboarding legal</title>
  <desc id="dD09">Diseno propuesto, no implementado: acceptance versionada del DPA con compuerta de publicacion; D-09 sigue pendiente de revision legal.</desc>
  <defs>
    <marker id="arr09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7177"/>
    </marker>
    <marker id="arr09Deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4483A"/>
    </marker>
  </defs>
  <rect width="1300" height="760" fill="#FBFAF8"/>

  <text x="650" y="38" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#16181A" letter-spacing="-0.3">D-09 - DPA Processor/Controller y onboarding legal</text>
  <text x="650" y="64" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5B6167">Diseno propuesto, no implementado - D-09 abierta - contrato y mecanismo pendientes de aprobacion</text>
  <line x1="60" y1="88" x2="1240" y2="88" stroke="#E2DED6" stroke-width="1"/>

  <!-- Paso 1: Alta tenant -->
  <rect x="60" y="114" width="220" height="104" rx="10" fill="#E6ECF5" stroke="#3C5A8A" stroke-opacity="0.35"/>
  <text x="80" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2B4470">1 - ALTA DEL TENANT</text>
  <text x="80" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#2B4470">Platform admin crea tenant</text>
  <text x="80" y="188" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#4B5F7E">Estado: `pending_legal`</text>
  <text x="80" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#4B5F7E">Sin storefront publicado aun</text>

  <!-- Paso 2: Magic link -->
  <rect x="300" y="114" width="220" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="320" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">2 - MAGIC LINK AL OWNER</text>
  <text x="320" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#16181A">Owner recibe magic link</text>
  <text x="320" y="188" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Supabase Auth; primera sesion</text>
  <text x="320" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">No lo hace el platform admin</text>

  <!-- Paso 3: DPA clickwrap -->
  <rect x="540" y="114" width="220" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.35"/>
  <text x="560" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#22483C">3 - ACEPTACION DPA</text>
  <text x="560" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#22483C">Clickwrap versionado</text>
  <text x="560" y="188" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#41695B">Casilla + texto legal</text>
  <text x="560" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#41695B">Texto y mecanismo aprobados por Legal</text>

  <!-- Paso 4: Endpoint y registro -->
  <rect x="780" y="114" width="220" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="800" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">4 - PERSISTENCIA</text>
  <text x="800" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#16181A">`POST /tenants/legal/accept`</text>
  <text x="800" y="188" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">`legal_acceptances` append-only</text>
  <text x="800" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#5B6167">Tenant; version; actor; evidencia</text>

  <!-- Paso 5: Activacion -->
  <rect x="1020" y="114" width="220" height="104" rx="10" fill="#F4F1EB" stroke="#8A6114" stroke-opacity="0.4"/>
  <text x="1040" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A6114">5 - TENANT ACTIVO</text>
  <text x="1040" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#8A6114">Bloqueado hasta aceptar</text>
  <text x="1040" y="188" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">No acepta -> no activa ni publica</text>
  <text x="1040" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Version nueva -> reaceptar</text>

  <!-- Conexiones 1-5 -->
  <line x1="284" y1="166" x2="294" y2="166" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="524" y1="166" x2="534" y2="166" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="764" y1="166" x2="774" y2="166" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="1004" y1="166" x2="1014" y2="166" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>

  <!-- Esquema legal_acceptances -->
  <rect x="60" y="248" width="590" height="130" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="80" y="276" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">TABLA `legal_acceptances` PROPUESTA (no implementada)</text>
  <text x="80" y="298" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">`id` uuid PK - `tenant_id` uuid FK - `document_type` text - `version` text</text>
  <text x="80" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">`document_hash` - `actor_id` - `method` - `accepted_at` (campos por validar)</text>
  <text x="80" y="334" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">Append-only + RLS propuestos; minimizacion/evidencia por aprobar</text>

  <!-- Esquema legal_documents -->
  <rect x="670" y="248" width="570" height="130" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="690" y="276" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">TABLA `legal_documents` (contenido inmutable)</text>
  <text x="690" y="298" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">`id` uuid PK - `type` text (DPA / ToS / privacidad) - `version` text</text>
  <text x="690" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">`content_hash` text - `content` text inmutable - `effective_from` / `effective_to`</text>
  <text x="690" y="334" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#16181A">Versionado con hash; plantilla aprobada por legal antes de cerrar D-09</text>

  <!-- Subencargados -->
  <rect x="60" y="400" width="590" height="118" rx="10" fill="#FAF3E6" stroke="#C08A2E" stroke-opacity="0.4"/>
  <text x="80" y="428" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A6114">SUBCARGADOS (procesadores de datos)</text>
  <text x="80" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Supabase - Vercel - Cloudflare - Fly.io - R2 - Resend/Postmark - Wompi - Stripe</text>
  <text x="80" y="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">Inventario, autorizacion de cambios y transferencias sujetos a revision legal</text>

  <!-- Residencia -->
  <rect x="670" y="400" width="570" height="118" rx="10" fill="#FAF3E6" stroke="#C08A2E" stroke-opacity="0.4"/>
  <text x="690" y="428" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A6114">RESIDENCIA Y TRANSFERENCIA</text>
  <text x="690" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Region/proveedores definitivos pendientes de confirmar</text>
  <text x="690" y="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">Transferencias y salvaguardas requieren analisis y aprobacion legal</text>

  <!-- Sin PII -->
  <rect x="60" y="540" width="590" height="118" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="80" y="568" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">SIN PII EN AUDITORIA</text>
  <text x="80" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">`decision_logs` sin nombres, emails, telefonos ni direcciones</text>
  <text x="80" y="608" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">`actor_id` pseudonimo - `context_summary` pasa por `redact()`</text>

  <!-- Pendiente legal -->
  <rect x="670" y="540" width="570" height="118" rx="10" fill="#F9EDEA" stroke="#B4483A" stroke-opacity="0.4"/>
  <text x="690" y="568" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8E3428">PENDIENTE DE REVISION LEGAL</text>
  <text x="690" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8E3428">Plantilla de DPA aprobada por abogado antes de cerrar D-09</text>
  <text x="690" y="608" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8E3428">Texto, evidencia, retencion, subencargados y region: validar</text>

  <!-- Conexiones a tablas -->
  <line x1="170" y1="218" x2="170" y2="242" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="410" y1="218" x2="410" y2="242" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="650" y1="218" x2="650" y2="242" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="890" y1="218" x2="890" y2="242" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>
  <line x1="1130" y1="218" x2="1130" y2="242" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr09)"/>

  <!-- Flecha de denegacion si no acepta -->
  <polyline points="1020,218 1020,260 300,260 300,218" fill="none" stroke="#B4483A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr09Deny)"/>
  <text x="640" y="236" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8E3426">Sin aceptar: no activa ni publica</text>

  <text x="1240" y="740" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#A0A5AA">Growup - docs/adr - D-09 - 2026-11</text>
</svg>
