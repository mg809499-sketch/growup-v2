<xml version="1.0" encoding="UTF-8">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" width="1300" height="680" role="img" aria-labelledby="tDsr dDsr">
  <title id="tDsr">Solicitud de un titular (DSR) - anonimizacion y retencion</title>
  <desc id="dDsr">Flujo de una solicitud de derechos del titular: solicitud, verificacion, ejecucion con decision de anonimizar o conservar, registro y respuesta, con matriz de retencion DIAN y tension DSR vs factura.</desc>
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7177"/>
    </marker>
    <marker id="arrDP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5E4E"/>
    </marker>
  </defs>
  <rect width="1300" height="680" fill="#FBFAF8"/>

  <text x="650" y="38" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#16181A" letter-spacing="-0.3">Solicitud de un titular (DSR)</text>
  <text x="650" y="64" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5B6167">Ley 1581/2012 - Circular 002/2025 SIC - DIAN 5 anos - anonimizacion por campo</text>
  <line x1="60" y1="88" x2="1240" y2="88" stroke="#E2DED6" stroke-width="1"/>

  <rect x="60" y="180" width="190" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="80" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#8A8F94">01</text>
  <text x="80" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#16181A">Solicitud</text>
  <text x="80" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">comprador o tenant</text>

  <rect x="289" y="180" width="190" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="309" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#8A8F94">02</text>
  <text x="309" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#16181A">Verificar identidad</text>
  <text x="309" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Validar identidad; actor check</text>

  <rect x="518" y="180" width="190" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.45"/>
  <text x="538" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#41695B">03</text>
  <text x="538" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#22483C">Ejecutar el DSR</text>
  <text x="538" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#41695B">platform:dsr; SECURITY DEFINER</text>

  <rect x="747" y="180" width="190" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="767" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#8A8F94">04</text>
  <text x="767" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#16181A">Registrar</text>
  <text x="767" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#5B6167">decision_logs append-only + hash</text>

  <rect x="976" y="180" width="264" height="104" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="996" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#8A8F94">05</text>
  <text x="996" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#16181A">Responder al titular</text>
  <text x="996" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">dentro del plazo legal (Ley 1581)</text>

  <line x1="258" y1="232" x2="283" y2="232" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="483" y1="232" x2="512" y2="232" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="712" y1="232" x2="741" y2="232" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrD)"/>
  <line x1="941" y1="232" x2="970" y2="232" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- Decision -->
  <line x1="613" y1="288" x2="613" y2="324" stroke="#2E5E4E" stroke-width="1.5" marker-end="url(#arrDP)"/>
  <text x="623" y="312" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#41695B">decide por campo</text>

  <rect x="60" y="330" width="1180" height="170" rx="12" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="88" y="364" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#16181A">Dato fiscal o de auditoria</text>

  <rect x="88" y="392" width="546" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.35"/>
  <text x="112" y="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#41695B">NO ES FISCAL NI DE AUDITORIA</text>
  <text x="112" y="446" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#22483C">Anonimizar: nombre, contacto, direccion e historial</text>
  <text x="112" y="466" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">La operacion queda registrada; el dato, no.</text>

  <rect x="656" y="392" width="546" height="104" rx="10" fill="#FAF3E6" stroke="#C08A2E" stroke-opacity="0.35"/>
  <text x="680" y="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8A6114">SI ES FISCAL O DE AUDITORIA</text>
  <text x="680" y="446" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5C4410">Conservar minimo: factura y nota credito DIAN</text>
  <text x="680" y="466" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#7A5A1E">Anonimizar lo demas; conservar direccion fiscal y NIT/CC.</text>
  <text x="680" y="482" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#7A5A1E">Se conservan para validez tributaria.</text>

  <text x="60" y="530" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#16181A">Regla: anonimizar por campo, no borrar la fila. Sin promesa de borrado inmediato en backups o logs historicos.</text>

  <!-- Matriz de retencion -->
  <rect x="60" y="552" width="546" height="100" rx="10" fill="#F4F1EB" stroke="#8A6114" stroke-opacity="0.3"/>
  <text x="80" y="576" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#8A6114">MATRIZ DE RETENCION</text>
  <text x="80" y="596" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">Ordenes/facturas: 5 anos DIAN; decision_logs: 5 anos (gobernanza)</text>
  <text x="80" y="614" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">auth_events: 1 ano; carritos: 30 dias -&gt; anonimizar</text>
  <text x="80" y="632" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">Media huerfana: 30 dias -&gt; limpiar</text>

  <!-- Residencia -->
  <rect x="634" y="552" width="606" height="100" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="654" y="576" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#5B6167">RESIDENCIA Y TRANSFERENCIA</text>
  <text x="654" y="596" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5B6167">Region unica Supabase; computo, colas, storage y observabilidad alineados</text>
  <text x="654" y="614" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#5B6167">Transferencia internacional: DPA + Clausulas Contractuales Modelo (Circular 003/2025)</text>

  <text x="1240" y="660" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#A0A5AA">Growup  -  docs/legal  -  2026-11</text>
</svg>
