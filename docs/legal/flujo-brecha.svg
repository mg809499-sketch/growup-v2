<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" width="1300" height="700" role="img" aria-labelledby="tBrecha dBrecha">
  <title id="tBrecha">Notificacion de una brecha de datos SLA dual</title>
  <desc id="dBrecha">Diseno propuesto: deteccion, contencion, aviso interno, evaluacion legal y apoyo al responsable. D-12 y los plazos aplicables siguen pendientes de validacion.</desc>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B6B1A8"/>
    </marker>
  </defs>
  <rect width="1300" height="700" fill="#FBFAF8"/>

  <text x="650" y="38" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#16181A" letter-spacing="-0.3">Notificacion de una brecha de datos</text>
  <text x="650" y="66" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5B6167">D-12 propuesta SLA interno/contractual por definir obligaciones y plazos por validar con asesoria</text>
  <line x1="60" y1="90" x2="1240" y2="90" stroke="#E2DED6" stroke-width="1"/>

  <!-- Fase 1 -->
  <rect x="60" y="170" width="340" height="330" rx="12" fill="#FFFFFF" stroke="#E2DED6"/>
  <circle cx="84" cy="206" r="4" fill="#B4483A"/>
  <text x="100" y="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8E3426">DETECCION Y CONTENCION</text>
  <text x="84" y="248" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" fill="#16181A">Detectar y contener</text>
  <text x="84" y="290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> alerta de 5xx, auth o cadena rota</text>
  <text x="84" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> reporte de un tenant o comprador</text>
  <text x="84" y="342" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> triage: que datos y cuantos titulares</text>
  <text x="84" y="368" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> contencion: rotar claves, cortar acceso</text>
  <text x="84" y="394" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> evidencia intacta antes de tocar nada</text>

  <!-- Fase 2 -->
  <rect x="444" y="170" width="340" height="330" rx="12" fill="#FFFFFF" stroke="#E2DED6"/>
  <circle cx="468" cy="206" r="4" fill="#C08A2E"/>
  <text x="484" y="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8A6114">AVISO INTERNO: SLA PENDIENTE</text>
  <text x="468" y="248" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" fill="#16181A">Decidir y avisar al tenant</text>
  <text x="468" y="290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> severidad y deber de notificar</text>
  <text x="468" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> aviso al tenant por canal acordado (objetivo abierto)</text>
  <text x="468" y="342" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> paquete de evidencia para el tenant</text>
  <text x="468" y="368" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> canal directo con el owner</text>
  <text x="468" y="394" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> solo hechos confirmados</text>

  <!-- Fase 3 -->
  <rect x="828" y="170" width="412" height="330" rx="12" fill="#FFFFFF" stroke="#E2DED6"/>
  <circle cx="852" cy="206" r="4" fill="#2E5E4E"/>
  <text x="868" y="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#41695B">SEGUN LEY APLICABLE Y HECHOS</text>
  <text x="852" y="248" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" fill="#16181A">Evaluar notificaciones y aprender</text>
  <text x="852" y="290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> asesoria determina deber, autoridad, destinatarios y plazo</text>
  <text x="852" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> Growup entrega evidencia y apoya al tenant</text>
  <text x="852" y="342" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> post-mortem sin culpables</text>
  <text x="852" y="368" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> acciones con dueno y fecha</text>
  <text x="852" y="394" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167"> se actualiza el runbook OPS-05</text>

  <line x1="408" y1="336" x2="438" y2="336" stroke="#B6B1A8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="792" y1="336" x2="822" y2="336" stroke="#B6B1A8" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- SLA dual -->
  <rect x="60" y="526" width="546" height="100" rx="12" fill="#FAF3E6" stroke="#C08A2E" stroke-opacity="0.4"/>
  <text x="80" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A6114">SLA PENDIENTE DE D-12 Y DEL DPA</text>
  <text x="80" y="576" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Aviso a tenant: objetivo interno/contractual por definir</text>
  <text x="80" y="596" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Autoridades/titulares: determinar deber y plazo para cada caso</text>
  <text x="80" y="616" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">No asumir plazo GDPR o colombiano sin validar aplicabilidad</text>

  <!-- Runbook -->
  <rect x="626" y="526" width="614" height="100" rx="12" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="646" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5B6167">RUNBOOK OPS-05</text>
  <text x="646" y="576" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Deteccion real: auth, WAF, DB, cadena de auditoria (no solo Sentry)</text>
  <text x="646" y="596" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">On-call, cadena de mando y plantillas son requisitos previos a produccion</text>

  <!-- Sin PII -->
  <text x="60" y="652" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#16181A">SIN PII CRUDA</text>
  <text x="60" y="674" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5B6167">Logs sin nombres, emails, telefonos ni direcciones trace_id para correlacion prompt_hash en lugar de prompts completos</text>

  <text x="1240" y="680" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#A0A5AA">Growup docs/legal 2026-11</text>
</svg>
