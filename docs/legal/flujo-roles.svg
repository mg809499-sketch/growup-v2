<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" role="img" aria-labelledby="tRoles dRoles">
  <title id="tRoles">Quién es quién frente a la ley — versión extendida (D-09 a D-18)</title>
  <desc id="dRoles">Reparto de roles entre comprador, tenant, Wompi, Stripe, Growup y proveedores críticos, con cumplimiento normativo colombiano y flujos de dinero separados.</desc>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7177"/>
    </marker>
    <marker id="arrRTenant" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4553C"/>
    </marker>
    <marker id="arrRPlatform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5E4E"/>
    </marker>
  </defs>
  <rect width="1300" height="820" fill="#FBFAF8"/>

  <text x="650" y="38" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="24" font-weight="700" fill="#16181A" letter-spacing="-0.3">Quién es quién frente a la ley</text>
  <text x="650" y="66" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="13" fill="#5B6167">Reparto de roles y flujos de dinero · MVP con cumplimiento Ley 1581, Estatuto 1480, DIAN, PCI-DSS v4.0.1</text>
  <line x1="60" y1="92" x2="1240" y2="92" stroke="#E2DED6" stroke-width="1"/>

  <!-- Línea 01 -->
  <text x="60" y="126" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">01 · VENTA DEL COMPRADOR (D-02, D-13, D-14)</text>

  <rect x="60" y="140" width="170" height="104" rx="10" fill="#E6ECF5" stroke="#3C5A8A" stroke-opacity="0.35"/>
  <text x="80" y="176" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#2B4470">Comprador</text>
  <text x="80" y="198" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#4B5F7E">invitado, sin cuenta</text>
  <text x="80" y="218" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#4B5F7E">compra en la tienda</text>

  <rect x="300" y="140" width="230" height="104" rx="10" fill="#F7E9E3" stroke="#B4553C" stroke-opacity="0.35"/>
  <text x="320" y="174" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#8E422E">Storefront del tenant</text>
  <text x="320" y="196" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#8E5B4C">catálogo · carrito</text>
  <text x="320" y="216" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#8E5B4C">checkout · retracto 5 días (D-13)</text>

  <rect x="600" y="140" width="230" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5CE"/>
  <text x="620" y="174" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#16181A">Wompi</text>
  <text x="620" y="196" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">cuenta del tenant</text>
  <text x="620" y="216" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">PSE · Nequi · tarjeta · 3DS</text>

  <rect x="900" y="140" width="340" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.35"/>
  <text x="920" y="174" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#22483C">Dinero al comerciante</text>
  <text x="920" y="196" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#41695B">Growup no lo toca</text>
  <text x="920" y="216" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#41695B">sin custodia de fondos (D-02, D-17)</text>

  <line x1="234" y1="192" x2="292" y2="192" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="534" y1="192" x2="592" y2="192" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="834" y1="192" x2="892" y2="192" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrR)"/>

  <text x="264" y="234" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">compra</text>
  <text x="564" y="234" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">paga</text>
  <text x="916" y="234" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">abona directo</text>

  <!-- Línea 02 -->
  <text x="60" y="280" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">02 · DATOS DEL PEDIDO Y PRIVACIDAD (D-09, D-10)</text>

  <rect x="300" y="294" width="320" height="118" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.45"/>
  <text x="320" y="328" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#22483C">Growup</text>
  <text x="320" y="348" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#41695B">encargado del tratamiento (processor)</text>
  <text x="320" y="368" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#41695B">órdenes, cliente, dirección</text>
  <text x="320" y="388" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#8E422E">nunca PAN ni CVV</text>

  <rect x="640" y="294" width="600" height="118" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="660" y="320" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8A8F94">RECIBE</text>
  <text x="660" y="342" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">· datos del checkout: nombre, contacto, dirección</text>
  <text x="660" y="362" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">· webhook firmado de Wompi: pago confirmado</text>
  <text x="660" y="382" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">· eventos de Stripe: estado de la suscripción</text>
  <text x="660" y="402" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">· DPA clickwrap y legal_acceptances (D-09)</text>

  <line x1="411" y1="278" x2="411" y2="288" stroke="#B4553C" stroke-width="1.5" marker-end="url(#arrRTenant)"/>
  <polyline points="701,278 701,304 560,304 560,312" fill="none" stroke="#2E5E4E" stroke-width="1.5" marker-end="url(#arrRPlatform)"/>
  <text x="421" y="284" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">datos</text>
  <text x="712" y="310" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">webhook firmado</text>

  <!-- Línea 03 -->
  <text x="60" y="440" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">03 · SUSCRIPCIÓN DE LA PLATAFORMA (D-01, D-15, D-18)</text>

  <rect x="60" y="454" width="230" height="104" rx="10" fill="#F7E9E3" stroke="#B4553C" stroke-opacity="0.35"/>
  <text x="80" y="490" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#8E422E">Tenant</text>
  <text x="80" y="512" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#8E5B4C">comerciante</text>
  <text x="80" y="530" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#8E5B4C">paga suscripción mensual</text>

  <rect x="430" y="454" width="290" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5CE"/>
  <text x="450" y="490" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#16181A">Stripe Billing</text>
  <text x="450" y="512" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">cuenta de Growup</text>
  <text x="450" y="530" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">tarjeta · COP · trial 14 días</text>

  <rect x="840" y="454" width="400" height="104" rx="10" fill="#F4F1EB" stroke="#8A6114" stroke-opacity="0.4"/>
  <text x="860" y="490" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="15" font-weight="600" fill="#8A6114">Growup · facturación</text>
  <text x="860" y="510" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">factura de suscripción (no del comprador)</text>
  <text x="860" y="530" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" fill="#5B6167">cobro de plataforma, separado del checkout</text>

  <line x1="294" y1="506" x2="422" y2="506" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="724" y1="506" x2="832" y2="506" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="358" y="496" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">paga</text>
  <text x="776" y="496" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#8A8F94">liquida</text>

  <!-- Línea 04: Proveedores críticos -->
  <text x="60" y="584" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">04 · PROVEEDORES CRÍTICOS Y VENDOR RISK (D-18)</text>

  <rect x="60" y="598" width="290" height="76" rx="10" fill="#F4F1EB" stroke="#8A6114" stroke-opacity="0.4"/>
  <text x="80" y="630" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" font-weight="700" fill="#8A6114">Supabase · Wompi · Stripe</text>
  <text x="80" y="650" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" fill="#5B6167">DB/Auth/RLS · checkout · suscripción</text>

  <rect x="370" y="598" width="290" height="76" rx="10" fill="#F4F1EB" stroke="#8A6114" stroke-opacity="0.4"/>
  <text x="390" y="630" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" font-weight="700" fill="#8A6114">Cloudflare · Fly.io · Resend/Postmark</text>
  <text x="390" y="650" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" fill="#5B6167">R2/CDN/WAF · cómputo · email transaccional</text>

  <rect x="680" y="598" width="560" height="76" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="700" y="630" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" font-weight="700" fill="#16181A">DIAN (Factus/Siigo/Alegra) · proveedores de email · subencargados DPA</text>
  <text x="700" y="650" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="11" fill="#5B6167">revisión anual de proveedores · SOC 2-ready · no facilitador fiscal (D-17)</text>

  <!-- Chips de rol -->
  <rect x="60" y="700" width="210" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="165" y="724" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#16181A">Vendedor = tenant</text>

  <rect x="290" y="700" width="230" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="405" y="724" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#16181A">Controller = tenant</text>

  <rect x="540" y="700" width="222" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="651" y="724" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#16181A">Processor = Growup</text>

  <rect x="782" y="700" width="250" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="907" y="724" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#16181A">Sin custodia de fondos</text>

  <rect x="1052" y="700" width="188" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="1146" y="724" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="12" font-weight="600" fill="#16181A">Vendedor = tenant</text>

  <text x="1240" y="800" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, nos" font-size="10.5" fill="#A0A5AA">Growup · docs/legal · 2026-11</text>
</svg>
