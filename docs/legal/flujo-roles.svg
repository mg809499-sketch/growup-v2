<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t1 d1">
  <title id="t1">Quién es quién frente a la ley</title>
  <desc id="d1">Flujo del dinero y de los datos entre comprador, storefront del tenant, Wompi, Growup y Stripe.</desc>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7177"/>
    </marker>
    <marker id="arr-tenant" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4553C"/>
    </marker>
    <marker id="arr-platform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5E4E"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FBFAF8"/>

  <text x="64" y="60" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="600" fill="#16181A" letter-spacing="-0.4">Quién es quién frente a la ley</text>
  <text x="64" y="90" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14.5" fill="#5B6167">Reparto de roles entre la plataforma, el comerciante y el comprador · MVP</text>
  <line x1="64" y1="112" x2="1136" y2="112" stroke="#E2DED6" stroke-width="1"/>

  <!-- Línea 01 -->
  <text x="64" y="152" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">01 · VENTA DEL COMPRADOR</text>

  <rect x="64" y="166" width="170" height="104" rx="10" fill="#E6ECF5" stroke="#3C5A8A" stroke-opacity="0.35"/>
  <text x="84" y="202" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#2B4470">Comprador</text>
  <text x="84" y="226" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#4B5F7E">invitado, sin cuenta</text>
  <text x="84" y="246" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#4B5F7E">compra en la tienda</text>

  <rect x="300" y="166" width="222" height="104" rx="10" fill="#F7E9E3" stroke="#B4553C" stroke-opacity="0.35"/>
  <text x="320" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#8E422E">Storefront del tenant</text>
  <text x="320" y="224" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8E5B4C">catálogo · carrito</text>
  <text x="320" y="244" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8E5B4C">checkout</text>

  <rect x="590" y="166" width="222" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5CE"/>
  <text x="610" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#16181A">Wompi</text>
  <text x="610" y="224" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">cuenta del tenant</text>
  <text x="610" y="244" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">PSE · Nequi · tarjeta</text>

  <rect x="880" y="166" width="256" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.35"/>
  <text x="900" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#22483C">Dinero al comerciante</text>
  <text x="900" y="224" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">Growup no lo toca</text>
  <text x="900" y="244" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">sin custodia de fondos</text>

  <line x1="238" y1="218" x2="292" y2="218" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="526" y1="218" x2="582" y2="218" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="816" y1="218" x2="872" y2="218" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr-ink)"/>

  <text x="264" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">compra</text>
  <text x="554" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">paga</text>
  <text x="844" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">abona</text>

  <!-- Línea 02 -->
  <text x="64" y="326" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">02 · DATOS DEL PEDIDO</text>

  <rect x="300" y="340" width="300" height="116" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.45"/>
  <text x="320" y="376" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#22483C">Growup</text>
  <text x="320" y="398" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">encargado del tratamiento</text>
  <text x="320" y="418" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">órdenes, cliente, dirección</text>
  <text x="320" y="438" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#8E422E">nunca PAN ni CVV</text>

  <rect x="640" y="340" width="496" height="116" rx="10" fill="#FFFFFF" stroke="#E2DED6"/>
  <text x="660" y="366" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8A8F94">RECIBE</text>
  <text x="660" y="390" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">· datos del checkout: nombre, contacto, dirección</text>
  <text x="660" y="410" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">· webhook firmado de Wompi: pago confirmado</text>
  <text x="660" y="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">· eventos de Stripe: estado de la suscripción</text>

  <line x1="411" y1="274" x2="411" y2="334" stroke="#B4553C" stroke-width="1.5" marker-end="url(#arr-tenant)"/>
  <text x="421" y="308" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">datos</text>

  <polyline points="701,274 701,300 560,300 560,334" fill="none" stroke="#2E5E4E" stroke-width="1.5" marker-end="url(#arr-platform)"/>
  <text x="712" y="306" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">webhook firmado</text>

  <!-- Línea 03 -->
  <text x="64" y="496" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8F94">03 · SUSCRIPCIÓN DE LA PLATAFORMA</text>

  <rect x="64" y="510" width="220" height="104" rx="10" fill="#F7E9E3" stroke="#B4553C" stroke-opacity="0.35"/>
  <text x="84" y="546" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#8E422E">Tenant</text>
  <text x="84" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8E5B4C">comerciante</text>
  <text x="84" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8E5B4C">paga mensual</text>

  <rect x="430" y="510" width="280" height="104" rx="10" fill="#FFFFFF" stroke="#D9D5CE"/>
  <text x="450" y="546" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#16181A">Stripe Billing</text>
  <text x="450" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">cuenta de Growup</text>
  <text x="450" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5B6167">tarjeta · COP</text>

  <rect x="846" y="510" width="290" height="104" rx="10" fill="#E7EFEA" stroke="#2E5E4E" stroke-opacity="0.35"/>
  <text x="866" y="546" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#22483C">Growup · facturación</text>
  <text x="866" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">factura de suscripción</text>
  <text x="866" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#41695B">no es la del comprador</text>

  <line x1="288" y1="562" x2="422" y2="562" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <line x1="714" y1="562" x2="838" y2="562" stroke="#6B7177" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <text x="355" y="552" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">paga</text>
  <text x="776" y="552" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8A8F94">liquida</text>

  <!-- Chips -->
  <rect x="64" y="650" width="210" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="169" y="675" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#16181A">Vendedor = tenant</text>

  <rect x="294" y="650" width="230" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="409" y="675" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#16181A">Controller = tenant</text>

  <rect x="544" y="650" width="222" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="655" y="675" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#16181A">Processor = Growup</text>

  <rect x="786" y="650" width="250" height="40" rx="20" fill="#F4F1EB" stroke="#E2DED6"/>
  <text x="911" y="675" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#16181A">Sin custodia de fondos</text>

  <text x="1136" y="696" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#A0A5AA">Growup · docs/legal · 2026-11</text>
</svg>
